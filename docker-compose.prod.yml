# Stack de PRODUÇÃO (referência): Nginx + Daphne (ASGI) + Celery + PostgreSQL + Redis
#   cp .env.prod.example .env.prod   (e preencha os segredos)
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile.prod
  env_file: .env.prod
  environment: &backend-env
    POSTGRES_HOST: db
    CELERY_BROKER_URL: redis://redis:6379/0
    CHANNEL_REDIS_URL: redis://redis:6379/1
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    env_file: .env.prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  migrate:               # roda uma vez: aplica migrações e coleta estáticos do admin
    <<: *backend
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput"
    volumes:
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend
    volumes:
      - static_data:/app/staticfiles
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *backend
    command: celery -A config worker -l info
    depends_on:
      backend:
        condition: service_healthy

  beat:
    <<: *backend
    command: celery -A config beat -l info
    depends_on:
      backend:
        condition: service_healthy

  web:                   # Nginx + build do React
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    volumes:
      - static_data:/static:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  static_data:
